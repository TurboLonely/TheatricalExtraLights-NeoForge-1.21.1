architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
}

configurations {
    shadowCommon
}

sourceSets {
    main {
        resources.srcDir file("src/generated/resources")
    }
}

dependencies {
    // We depend on fabric loader here to use the fabric @Environment annotations and get the mixin dependencies
    // Do NOT use other classes from fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_version}"

    // ArtNet
    implementation "ch.bildspur:artnet4j:${rootProject.artnet4j_version}"

    // Compile against the local Theatrical 1.21.1 (NeoForge) port build output.
    //
    // This MUST be a jar, not a class directory. The Architectury transformer
    // builds its lookup classpath (ReadClasspathProviderImpl) by scanning each
    // entry: `.class` files are indexed, `.jar`/`.zip` archives are indexed via
    // walkArchive(), and anything else (e.g. a directory) silently yields an
    // empty list. A directory entry therefore never resolves, and
    // `transformProduction*` dies with
    // "Type <theatrical class> not present".
    def theatricalCommonDev = fileTree(dir: "${rootDir}/../theatrical-1.21.1/common/build/devlibs", include: ["*-dev.jar"])
    if (!theatricalCommonDev.isEmpty()) {
        compileOnly theatricalCommonDev
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
