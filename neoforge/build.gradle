plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    neoForge {
    }

    runs {
        client {
            client()
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    // ArtNet
    implementation "ch.bildspur:artnet4j:${rootProject.artnet4j_version}"
    forgeRuntimeLibrary "ch.bildspur:artnet4j:${rootProject.artnet4j_version}"
    include "ch.bildspur:artnet4j:${rootProject.artnet4j_version}"

    // YAML
    implementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
    forgeRuntimeLibrary "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
    include "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"

    // Compile against the local Theatrical 1.21.1 (NeoForge) port build output.
    // Dev jars (named mappings), not class directories - see the note in
    // common/build.gradle about the Architectury transformer classpath.
    def theatricalCommonDev = fileTree(dir: "${rootDir}/../theatrical-1.21.1/common/build/devlibs", include: ["*-dev.jar"])
    if (!theatricalCommonDev.isEmpty()) {
        compileOnly theatricalCommonDev
    }
    def theatricalNeoForgeDev = fileTree(dir: "${rootDir}/../theatrical-1.21.1/neoforge/build/devlibs", include: ["*-dev.jar"])
    if (!theatricalNeoForgeDev.isEmpty()) {
        compileOnly theatricalNeoForgeDev
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveBaseName.set "${rootProject.archives_base_name}-${project.name}"
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    repositories {
    }
}
